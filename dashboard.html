<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDLM Membership Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f5f7fa}.member-photo{width:48px;height:48px;object-fit:cover;border-radius:6px}.member-name{font-weight:600}.table td,.table th{vertical-align:middle}.loading{text-align:center}
</style>
</head>
<body>
<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>SDLM Membership Dashboard</h2>
    <button class="btn btn-success" onclick="exportCSV()">Export CSV</button>
  </div>

  <div class="mb-3">
    <input id="search" class="form-control" placeholder="Search by name, member ID, mobile or email" oninput="renderMembers()">
  </div>

  <div class="table-responsive">
    <table class="table table-bordered table-hover bg-white">
      <thead class="table-light">
        <tr>
          <th>Photo</th>
          <th>Member ID</th>
          <th>Name</th>
          <th>Mobile</th>
          <th>Email</th>
          <th>Membership</th>
          <th>Card</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="membersTable">
        <tr><td colspan="8" class="loading">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
let allMembers=[];

function escapeHtml(value){
  return String(value??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}

async function loadMembers(){
  try{
    const res=await fetch('/api/members');
    const data=await res.json();
    if(!data.success) throw new Error(data.message||'Failed to load members');
    allMembers=data.members||[];
    renderMembers();
  }catch(err){
    document.getElementById('membersTable').innerHTML=`<tr><td colspan="8" class="text-danger text-center">${escapeHtml(err.message)}</td></tr>`;
  }
}

function renderMembers(){
  const k=document.getElementById('search').value.trim().toLowerCase();
  const members=allMembers.filter(m=>
    String(m.fullName||'').toLowerCase().includes(k)||
    String(m.memberId||'').toLowerCase().includes(k)||
    String(m.mobile||'').toLowerCase().includes(k)||
    String(m.email||'').toLowerCase().includes(k)
  );

  const tbody=document.getElementById('membersTable');
  if(!members.length){
    tbody.innerHTML='<tr><td colspan="8" class="text-center">No members found.</td></tr>';
    return;
  }

  tbody.innerHTML=members.map(m=>{
    const id=m.memberId||'';
    const photo=m.photoUrl?`<img class="member-photo" src="/api/photo?url=${encodeURIComponent(m.photoUrl)}" loading="lazy" alt="Photo">`:'—';
    return `<tr>
      <td>${photo}</td>
      <td>${escapeHtml(id)}</td>
      <td class="member-name">${escapeHtml(m.fullName)}</td>
      <td>${escapeHtml(m.mobile)}</td>
      <td>${escapeHtml(m.email)}</td>
      <td>${escapeHtml(m.membershipType)}</td>
      <td><a class="btn btn-sm btn-primary" href="/member-card.html?memberId=${encodeURIComponent(id)}" target="_blank">View</a></td>
      <td><a class="btn btn-sm btn-outline-secondary" href="/edit-member.html?memberId=${encodeURIComponent(id)}">Edit</a></td>
    </tr>`;
  }).join('');
}

function csvEscape(value){
  return `"${String(value??'').replace(/"/g,'""')}"`;
}

function exportCSV(){
  let c='Member ID,Name,Mobile,Email,Membership Type\n';
  allMembers.forEach(m=>{
    c+=[m.memberId,m.fullName,m.mobile,m.email,m.membershipType].map(csvEscape).join(',')+'\n';
  });
  const blob=new Blob([c],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='sdlm-members.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

loadMembers();
</script>
</body>
</html>
