<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f5f5f5}.card-stat{text-align:center}.table td{vertical-align:middle}.member-photo{width:58px;height:58px;object-fit:cover;border-radius:8px;border:1px solid #ddd;background:#fff}.table th{white-space:nowrap}.member-name{font-weight:600}.action-buttons{white-space:nowrap}.page-title{font-weight:700}.table-responsive{background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.05)}@media(max-width:767px){.page-title{font-size:22px}.table{font-size:14px}.member-photo{width:48px;height:48px}}
</style>
</head>
<body>
<div class="container-fluid container-lg py-4">
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4"><h2 class="page-title mb-0">Sub Divisional Library Miao - Dashboard</h2><button class="btn btn-danger" onclick="logout()">Logout</button></div>
<div class="row mb-4"><div class="col-sm-6 col-md-3"><div class="card card-stat"><div class="card-body"><h5>Total Members</h5><h2 id="totalMembers">0</h2></div></div></div></div>
<div class="mb-3"><input id="searchBox" class="form-control" placeholder="Search Name / Member ID / Mobile"></div>
<div class="mb-3 d-flex flex-wrap gap-2"><button class="btn btn-success" onclick="exportExcel()">Export Excel</button><button class="btn btn-primary" onclick="printMembers()">Print Members</button><button class="btn btn-warning" onclick="generateReport()">Monthly Report</button></div>
<div class="table-responsive"><table class="table table-bordered table-striped mb-0"><thead><tr><th>Photo</th><th>Member ID</th><th>Name</th><th>Mobile</th><th>Membership</th><th>Card</th><th>Action</th></tr></thead><tbody id="memberTable"></tbody></table></div>
</div>
<script>
if(sessionStorage.getItem("libraryLoggedIn")!=="yes"){window.location.href="login.html";}
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwu7yamVKdb7h9VWGGQ_eUHGpUJesvP4tinAEHAKLhc31tyeEEeOyPdboF0AUwZJLjS/exec";
let allMembers=[];
loadDashboard();
async function loadDashboard(){await loadStats();await loadMembers();}
async function loadStats(){try{const response=await fetch(SCRIPT_URL+"?action=getDashboardStats&_="+Date.now(),{cache:"no-store"});const result=await response.json();if(result.status==="success")document.getElementById("totalMembers").innerText=(result.stats||{}).total||0;}catch(err){console.error("Stats error:",err);}}
async function loadMembers(){try{const response=await fetch(SCRIPT_URL+"?action=getAllMembers&_="+Date.now(),{cache:"no-store"});const result=await response.json();if(result.status!=="success")throw new Error(result.message||"Unable to load members");allMembers=result.members||[];renderMembers(allMembers);}catch(err){console.error("Members error:",err);document.getElementById("memberTable").innerHTML='<tr><td colspan="7" class="text-center text-danger py-4">Unable to load member data</td></tr>';}}
function driveImageUrl(url){if(!url)return "https://via.placeholder.com/58x58?text=Photo";const value=String(url).trim();let match=value.match(/[?&]id=([A-Za-z0-9_-]+)/);if(match)return "https://drive.google.com/thumbnail?id="+match[1]+"&sz=w200";match=value.match(/\/d\/([A-Za-z0-9_-]+)/);if(match)return "https://drive.google.com/thumbnail?id="+match[1]+"&sz=w200";return value;}
function escapeHtml(value){return String(value==null?"":value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function safeMemberId(value){return String(value||"").replace(/[^A-Za-z0-9_-]/g,"");}
function renderMembers(members){const table=document.getElementById("memberTable");table.innerHTML="";if(!members.length){table.innerHTML='<tr><td colspan="7" class="text-center py-4">No Members Found</td></tr>';return;}members.forEach(function(member){const id=String(member.memberId||"");const photo=driveImageUrl(member.photoUrl);table.insertAdjacentHTML("beforeend",`<tr><td><img src="${escapeHtml(photo)}" class="member-photo" alt="Photo" onerror="this.src='https://via.placeholder.com/58x58?text=Photo'"></td><td>${escapeHtml(id)}</td><td class="member-name">${escapeHtml(member.fullName)}</td><td>${escapeHtml(member.mobile)}</td><td>${escapeHtml(member.membershipType)}</td><td><a href="member-card.html?id=${encodeURIComponent(id)}" target="_blank" class="btn btn-primary btn-sm">Card</a></td><td class="action-buttons"><button class="btn btn-warning btn-sm" onclick="editMember('${safeMemberId(id)}')">Edit</button><button class="btn btn-danger btn-sm ms-1" onclick="deleteMember('${safeMemberId(id)}')">Delete</button></td></tr>`);});}
document.getElementById("searchBox").addEventListener("input",function(){const keyword=this.value.toLowerCase().trim();renderMembers(allMembers.filter(function(member){return String(member.fullName||"").toLowerCase().includes(keyword)||String(member.memberId||"").toLowerCase().includes(keyword)||String(member.mobile||"").toLowerCase().includes(keyword);}));});
async function deleteMember(memberId){if(!confirm("Delete Member : "+memberId+" ?"))return;try{const response=await fetch(SCRIPT_URL+"?action=deleteMember&memberId="+encodeURIComponent(memberId)+"&_="+Date.now(),{cache:"no-store"});const result=await response.json();alert(result.message||"Done");if(result.status==="success")loadDashboard();}catch(err){alert("Delete Failed");}}
function editMember(memberId){alert("Edit feature is not enabled on this page yet.");}
function exportExcel(){let csv="Member ID,Name,Mobile,Membership Type\n";allMembers.forEach(function(m){csv+=`"${String(m.memberId||"").replace(/"/g,'""')}","${String(m.fullName||"").replace(/"/g,'""')}","${String(m.mobile||"").replace(/"/g,'""')}","${String(m.membershipType||"").replace(/"/g,'""')}"\n`;});const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="LibraryMembers.csv";a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);}
function printMembers(){window.print();}function generateReport(){alert("Total Members : "+allMembers.length);}function logout(){if(confirm("Are you sure you want to logout?")){sessionStorage.removeItem("libraryLoggedIn");window.location.href="login.html";}}
</script>
</body>
</html>
