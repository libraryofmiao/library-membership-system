<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f5f5f5}.member-photo{width:50px;height:50px;object-fit:cover;border-radius:50%;border:1px solid #ddd;background:#fff}.card-stat{text-align:center}.table td{vertical-align:middle}
</style>
</head>
<body>
<div class="container py-4">
<div class="d-flex justify-content-between align-items-center mb-4"><h2>Sub Divisional Library Miao - Dashboard</h2><button class="btn btn-danger" onclick="logout()">Logout</button></div>
<div class="row mb-4"><div class="col-md-3"><div class="card card-stat"><div class="card-body"><h5>Total Members</h5><h2 id="totalMembers">0</h2></div></div></div></div>
<div class="mb-3"><input id="searchBox" class="form-control" placeholder="Search Name / Member ID / Mobile"></div>
<div class="mb-3"><button class="btn btn-success" onclick="exportExcel()">Export Excel</button><button class="btn btn-primary ms-2" onclick="printMembers()">Print Members</button><button class="btn btn-warning ms-2" onclick="generateReport()">Monthly Report</button></div>
<div class="table-responsive"><table class="table table-bordered table-striped"><thead><tr><th>Photo</th><th>Member ID</th><th>Name</th><th>Mobile</th><th>Membership</th><th>Card</th><th>Action</th></tr></thead><tbody id="memberTable"></tbody></table></div>
</div>
<script>
if(sessionStorage.getItem("libraryLoggedIn")!=="yes"){window.location.href="login.html";}
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwu7yamVKdb7h9VWGGQ_eUHGpUJesvP4tinAEHAKLhc31tyeEEeOyPdboF0AUwZJLjS/exec";
let allMembers=[];
loadDashboard();

async function loadDashboard(){await loadStats();await loadMembers();}

async function loadStats(){
 try{
  const response=await fetch(SCRIPT_URL+"?action=getDashboardStats&_="+Date.now(),{cache:"no-store"});
  const result=await response.json();
  if(result.status==="success"){
   const stats=result.stats||{};
   document.getElementById("totalMembers").innerText=stats.total||0;
  }
 }catch(err){console.error("Stats error:",err);}
}

async function loadMembers(){
 try{
  const response=await fetch(SCRIPT_URL+"?action=getAllMembers&_="+Date.now(),{cache:"no-store"});
  const result=await response.json();
  if(result.status==="success"){allMembers=result.members||[];renderMembers(allMembers);}
  else{throw new Error(result.message||"Unable to load members");}
 }catch(err){console.error("Members error:",err);document.getElementById("memberTable").innerHTML='<tr><td colspan="7" class="text-center text-danger">Unable to load member data</td></tr>';}
}

function driveImageUrl(url){
 if(!url)return "https://via.placeholder.com/50";
 const value=String(url).trim();
 let match=value.match(/[?&]id=([A-Za-z0-9_-]+)/);
 if(match)return "https://drive.google.com/thumbnail?id="+match[1]+"&sz=w200";
 match=value.match(/\/d\/([A-Za-z0-9_-]+)/);
 if(match)return "https://drive.google.com/thumbnail?id="+match[1]+"&sz=w200";
 return value;
}

function escapeHtml(value){
 return String(value==null?"":value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function renderMembers(members){
 const table=document.getElementById("memberTable");table.innerHTML="";
 if(!members.length){table.innerHTML='<tr><td colspan="7" class="text-center">No Members Found</td></tr>';return;}
 members.forEach(member=>{
  const photo=driveImageUrl(member.photoUrl);
  table.innerHTML+=`<tr><td><img src="${photo}" class="member-photo" onerror="this.src='https://via.placeholder.com/50'"></td><td>${escapeHtml(member.memberId)}</td><td>${escapeHtml(member.fullName)}</td><td>${escapeHtml(member.mobile)}</td><td>${escapeHtml(member.membershipType)}</td><td><a href="member-card.html?id=${encodeURIComponent(member.memberId||"")}" target="_blank" class="btn btn-primary btn-sm">Card</a></td><td><button class="btn btn-warning btn-sm" onclick="editMember('${String(member.memberId||"").replace(/'/g,"\\'")}')">Edit</button><button class="btn btn-danger btn-sm ms-1" onclick="deleteMember('${String(member.memberId||"").replace(/'/g,"\\'")}')">Delete</button></td></tr>`;
 });
}

document.getElementById("searchBox").addEventListener("keyup",function(){
 const keyword=this.value.toLowerCase();
 const filtered=allMembers.filter(member=>(member.fullName||"").toLowerCase().includes(keyword)||(member.memberId||"").toLowerCase().includes(keyword)||(member.mobile||"").toLowerCase().includes(keyword));
 renderMembers(filtered);
});

async function deleteMember(memberId){
 if(!confirm("Delete Member : "+memberId+" ?"))return;
 try{const response=await fetch(SCRIPT_URL+"?action=deleteMember&memberId="+encodeURIComponent(memberId)+"&_="+Date.now(),{cache:"no-store"});const result=await response.json();alert(result.message||"Done");loadDashboard();}catch(err){alert("Delete Failed");}
}

async function editMember(memberId){alert("Edit feature connected to backend updateMember().");}

function exportExcel(){let csv="Member ID,Name,Mobile,Membership Type\n";allMembers.forEach(m=>{csv+=`"${String(m.memberId||"").replace(/"/g,'""')}","${String(m.fullName||"").replace(/"/g,'""')}","${String(m.mobile||"").replace(/"/g,'""')}","${String(m.membershipType||"").replace(/"/g,'""')}"\n`;});const blob=new Blob([csv],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="LibraryMembers.csv";a.click();URL.revokeObjectURL(a.href);}
function printMembers(){window.print();}
function generateReport(){alert("Total Members : "+allMembers.length);}
function logout(){if(confirm("Are you sure you want to logout?")){sessionStorage.removeItem("libraryLoggedIn");window.location.href="login.html";}}
</script>
</body>
</html>
