<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Member</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f5f5f5}.edit-wrap{max-width:1000px;margin:auto}.card{border:0;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.08)}.section-title{font-weight:700;border-bottom:1px solid #eee;padding-bottom:8px;margin-bottom:18px}.readonly{background:#eee}.photo-preview{width:130px;height:160px;object-fit:cover;border-radius:10px;border:1px solid #ddd;background:#fff}.required:after{content:' *';color:#dc3545}.saving{pointer-events:none;opacity:.7}</style>
</head><body>
<div class="container py-4 edit-wrap"><div class="d-flex justify-content-between align-items-center mb-3"><h2 class="mb-0">Edit Member</h2><button class="btn btn-secondary" onclick="history.back()">Back</button></div>
<div class="card"><div class="card-body p-4"><div id="message"></div><form id="editForm">
<h5 class="section-title">Member Information</h5><div class="row g-3">
<div class="col-md-4"><label class="form-label">Member ID</label><input id="memberId" class="form-control readonly" readonly></div>
<div class="col-md-4"><label class="form-label required">Full Name</label><input id="fullName" class="form-control" required></div>
<div class="col-md-4"><label class="form-label">Guardian</label><input id="guardian" class="form-control"></div>
<div class="col-md-4"><label class="form-label">Gender</label><select id="gender" class="form-select"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>
<div class="col-md-4"><label class="form-label">Date of Birth</label><input id="dob" type="date" class="form-control"></div>
<div class="col-md-4"><label class="form-label">Occupation</label><input id="occupation" class="form-control"></div>
<div class="col-md-4"><label class="form-label">Mobile</label><input id="mobile" class="form-control"></div>
<div class="col-md-4"><label class="form-label">Email</label><input id="email" type="email" class="form-control"></div>
<div class="col-md-4"><label class="form-label">Membership Type</label><input id="membershipType" class="form-control"></div>
<div class="col-md-4"><label class="form-label">Duration</label><input id="duration" class="form-control"></div>
<div class="col-md-4"><label class="form-label">ID Type</label><input id="idType" class="form-control"></div>
<div class="col-md-4"><label class="form-label">ID Number</label><input id="idNumber" class="form-control"></div>
<div class="col-md-4"><label class="form-label">Status</label><select id="status" class="form-select"><option value="Active">Active</option><option value="Inactive">Inactive</option><option value="Expired">Expired</option></select></div>
<div class="col-12"><label class="form-label">Address</label><textarea id="address" class="form-control" rows="2"></textarea></div>
<div class="col-md-4"><label class="form-label">District</label><input id="district" class="form-control"></div>
<div class="col-md-4"><label class="form-label">State</label><input id="state" class="form-control"></div>
<div class="col-md-4"><label class="form-label">Pincode</label><input id="pincode" class="form-control"></div></div>
<h5 class="section-title mt-4">Photo</h5><div class="row g-3 align-items-center"><div class="col-auto"><img id="photoPreview" class="photo-preview" alt="Member photo"></div><div class="col-md-6"><label class="form-label">Replace Photo (optional)</label><input id="photo" type="file" class="form-control" accept="image/*"><small class="text-muted">Leave empty to keep the existing photo.</small></div></div>
<div class="d-flex gap-2 mt-4"><button id="saveBtn" class="btn btn-success" type="submit">Save Changes</button><button class="btn btn-secondary" type="button" onclick="history.back()">Cancel</button></div>
</form></div></div></div>
<script>
if(sessionStorage.getItem("libraryLoggedIn")!=="yes")location.href="login.html";
const API_BASE=window.MEMBERSHIP_API_BASE||"https://library-membership-system.libraryofmiao.workers.dev/api";
const memberId=new URLSearchParams(location.search).get("id");
const fields=["memberId","fullName","guardian","gender","dob","occupation","mobile","email","membershipType","duration","idType","idNumber","status","address","district","state","pincode"];
const editableFields=fields.slice(1);const $=id=>document.getElementById(id);function show(t,c){$("message").innerHTML='<div class="alert alert-'+c+'">'+t+'</div>'}
async function api(path,options={}){const r=await fetch(API_BASE+path,{...options,cache:"no-store",headers:{"Content-Type":"application/json",...(options.headers||{})}});const x=await r.json().catch(()=>({}));if(!r.ok||x.success===false)throw Error(x.message||"Request failed");return x}
async function loadMember(){if(!memberId){show("Missing member ID.","danger");return}try{const x=await api("/member?memberId="+encodeURIComponent(memberId));const m=x.member||{};fields.forEach(f=>$(f).value=m[f]==null?"":m[f]);$("memberId").value=memberId;try{$("photoPreview").src=API_BASE+"/photo?memberId="+encodeURIComponent(memberId)+"&_="+Date.now()}catch(e){}}catch(e){show(e.message||"Unable to load member.","danger");$("editForm").style.display="none"}}
$("photo").addEventListener("change",function(){if(this.files[0])$("photoPreview").src=URL.createObjectURL(this.files[0])});
function optimizePhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const maxW=600,maxH=750,scale=Math.min(1,maxW/img.width,maxH/img.height),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/webp",.82))};img.src=reader.result};reader.readAsDataURL(file)})}
$("editForm").addEventListener("submit",async function(e){e.preventDefault();const b=$("saveBtn");b.disabled=true;b.textContent="Saving...";try{const d={memberId};editableFields.forEach(f=>d[f]=$(f).value);const f=$("photo").files[0];if(f){if(f.size>5*1024*1024)throw Error("Photo must be 5 MB or smaller.");d.photoUrl=await optimizePhoto(f)}const x=await api("/member",{method:"PATCH",body:JSON.stringify(d)});show(x.message||"Member updated successfully.","success");setTimeout(()=>location.href="dashboard.html",800)}catch(e){show(e.message||"Update failed.","danger");b.disabled=false;b.textContent="Save Changes"}});loadMember();
</script></body></html>
