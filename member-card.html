<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Membership Card</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{background:#f5f5f5}.card-wrapper{max-width:900px;margin:auto}.member-card{width:850px;height:520px;background:#fff;border:3px solid #0d6efd;border-radius:15px;overflow:hidden;position:relative}.header{background:#0d6efd;color:#fff;text-align:center;padding:15px}.body-section{padding:20px}.photo{width:160px;height:190px;object-fit:cover;border:2px solid #ccc}.member-info{font-size:18px;line-height:2}.footer{position:absolute;bottom:0;width:100%;text-align:center;background:#f1f1f1;padding:10px}.qr{text-align:center}@media(max-width:900px){.member-card{width:100%;height:auto}}#libraryLogo{display:block;margin:auto;height:80px;width:auto;margin-bottom:10px;background:white;border-radius:50%;padding:5px}
</style>
</head>
<body>
<div class="container py-4"><div class="card-wrapper">
<h2 class="text-center mb-3">Digital Membership Card</h2>
<div id="membershipCard" class="member-card">
<div class="header">
<img id="libraryLogo" src="https://drive.google.com/thumbnail?id=1mLDm4Y1bu7UG-WP7h-RzRoDrpQTwY2pe" alt="Library Logo">
<h3>Sub Divisional Library Miao</h3><p class="mb-0">Library Membership Card</p>
</div>
<div class="body-section"><div class="row">
<div class="col-md-3 text-center"><img id="memberPhoto" class="photo" src="https://via.placeholder.com/160x190" alt="Member Photo"></div>
<div class="col-md-6"><div class="member-info">
<strong>Name:</strong> <span id="memberName">Loading...</span><br>
<strong>Member ID:</strong> <span id="memberId">Loading...</span><br>
<strong>Membership:</strong> <span id="memberType">General</span><br>
<strong>Issue Date:</strong> <span id="issueDate">-</span><br>
<strong>Status:</strong> <span id="membershipStatus">Permanent Member</span>
</div></div>
<div class="col-md-3 qr"><div id="qrcode"></div><p class="mt-2">Scan Verification</p></div>
</div></div>
<div style="position:absolute;right:30px;bottom:70px;text-align:center;font-size:14px;">____________________<br>Authorized Signatory</div>
<div class="footer">Sub Divisional Library Miao</div>
</div>
<div class="text-center mt-4">
<button class="btn btn-primary" onclick="downloadCard()">Download PDF Card</button>
<button class="btn btn-success ms-2" onclick="window.print()">Print Card</button>
<button class="btn btn-info ms-2" onclick="openVerification()">Verify Member</button>
</div>
</div></div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwu7yamVKdb7h9VWGGQ_eUHGpUJesvP4tinAEHAKLhc31tyeEEeOyPdboF0AUwZJLjS/exec";
let currentVerifyCode="";
const params=new URLSearchParams(window.location.search);
const memberId=params.get("id");

if(!memberId){
 alert("Member ID missing in URL");
}else{
 loadMember(memberId);
}

async function loadMember(memberId){
 try{
  const url=SCRIPT_URL+"?action=getMember&memberId="+encodeURIComponent(memberId)+"&_="+Date.now();
  const response=await fetch(url,{method:"GET",redirect:"follow",cache:"no-store"});
  const text=await response.text();
  let result;
  try{result=JSON.parse(text);}catch(parseError){
   console.error("Apps Script returned non-JSON:",text);
   throw new Error("Apps Script did not return JSON. Response: "+text.substring(0,200));
  }
  if(result.status!=="success" || !result.member){
   throw new Error(result.message||"Member not found.");
  }
  fillCard(result.member);
 }catch(err){
  console.error("Unable to load member:",err);
  alert("Unable to load member data.\n\n"+(err.message||err));
 }
}

function driveImageUrl(url){
 if(!url)return "https://via.placeholder.com/160x190";
 const value=String(url).trim();
 let match=value.match(/[?&]id=([A-Za-z0-9_-]+)/);
 if(match)return "https://drive.google.com/thumbnail?id="+match[1]+"&sz=w600";
 match=value.match(/\/d\/([A-Za-z0-9_-]+)/);
 if(match)return "https://drive.google.com/thumbnail?id="+match[1]+"&sz=w600";
 return value;
}

function fillCard(member){
 document.getElementById("memberName").innerText=member.fullName||"";
 document.getElementById("memberId").innerText=member.memberId||"";
 document.getElementById("memberType").innerText=member.membershipType||"";
 document.getElementById("issueDate").innerText=member.issueDate||member.timestamp||"";
 document.getElementById("membershipStatus").innerText=member.status||"Active";
 const photoElement=document.getElementById("memberPhoto");
 photoElement.src=driveImageUrl(member.photoUrl);
 photoElement.onerror=function(){this.src="https://via.placeholder.com/160x190";};
 if(!member.verify){
  console.error("Verify code missing:",member);
  alert("Verification code is missing for this member.\nPlease check column U (Verify) in the Members sheet.");
  return;
 }
 currentVerifyCode=String(member.verify).trim();
 generateQR(currentVerifyCode);
}

function generateQR(verifyCode){
 const qrContainer=document.getElementById("qrcode");
 qrContainer.innerHTML="";
 if(!verifyCode)return;
 const verificationURL=new URL("verify.html",window.location.href);
 verificationURL.searchParams.set("verify",verifyCode);
 new QRCode(qrContainer,{text:verificationURL.href,width:120,height:120});
}

function openVerification(){
 if(!currentVerifyCode){alert("Verification code is missing.");return;}
 const verificationURL=new URL("verify.html",window.location.href);
 verificationURL.searchParams.set("verify",currentVerifyCode);
 window.open(verificationURL.href,"_blank");
}

async function downloadCard(){
 try{
  const card=document.getElementById("membershipCard");
  const canvas=await html2canvas(card,{scale:3,useCORS:true,allowTaint:false});
  const imgData=canvas.toDataURL("image/png");
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF("landscape","mm","a4");
  pdf.addImage(imgData,"PNG",10,10,277,170);
  const id=document.getElementById("memberId").innerText;
  pdf.save((id||"membership-card")+".pdf");
 }catch(err){console.error("PDF generation error:",err);alert("Unable to generate PDF.");}
}
</script>
</body>
</html>
