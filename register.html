<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Membership Registration</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f4f6f9}.form-container{background:#fff;border-radius:12px;padding:30px;box-shadow:0 0 15px rgba(0,0,0,.08)}.required{color:red}.photo-preview{width:150px;height:180px;border:2px dashed #ccc;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:10px;background:#fafafa} .photo-preview img{width:100%;height:100%;object-fit:cover}h2{font-weight:700}
.option-manager-buttons{z-index:2}.modal-backdrop-custom{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1055}.option-manager-modal{width:min(560px,100%);max-height:85vh;overflow:auto;background:#fff;border-radius:12px;padding:24px;box-shadow:0 10px 35px rgba(0,0,0,.2)}.option-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}.option-row input{flex:1}@media(max-width:767px){.option-manager-buttons{position:static!important;justify-content:center;margin-top:12px;flex-wrap:wrap}.option-manager-buttons .btn{font-size:.8rem}}
</style>
</head>
<body>
<div class="container py-5"><div class="form-container">
<div class="position-relative mb-4">
<div class="text-center"><h2>Library Membership Registration Form</h2><p class="text-muted">Please fill all required details carefully.</p></div>
<div class="option-manager-buttons position-absolute top-0 end-0 d-flex gap-2">
<button type="button" class="btn btn-outline-primary btn-sm" id="manageMembershipTypeBtn" tabindex="-1">Add/Edit Membership Type</button>
<button type="button" class="btn btn-outline-primary btn-sm" id="manageIdTypeBtn" tabindex="-1">Add/Edit Id Type</button>
</div>
</div>
<form id="registrationForm">
<div class="row">
<div class="col-md-6 mb-3"><label class="form-label">Full Name <span class="required">*</span></label><input type="text" class="form-control" id="fullName" required></div>
<div class="col-md-6 mb-3"><label class="form-label">Father's / Guardian's Name</label><input type="text" class="form-control" id="guardianName"></div>
<div class="col-md-4 mb-3"><label class="form-label">Gender <span class="required">*</span></label><select class="form-select" id="gender" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>
<div class="col-md-4 mb-3"><label class="form-label">Date of Birth <span class="required">*</span></label><input type="date" class="form-control" id="dob" required></div>
<div class="col-md-4 mb-3"><label class="form-label">Occupation</label><input type="text" class="form-control" id="occupation"></div>
</div>
<div class="mb-3"><label class="form-label">Address <span class="required">*</span></label><textarea class="form-control" id="address" rows="3" required></textarea></div>
<div class="row">
<div class="col-md-4 mb-3"><label class="form-label">District</label><input type="text" class="form-control" id="district"></div>
<div class="col-md-4 mb-3"><label class="form-label">State</label><input type="text" class="form-control" id="state"></div>
<div class="col-md-4 mb-3"><label class="form-label">PIN Code</label><input type="text" class="form-control" id="pincode" maxlength="6"></div>
</div>
<div class="row">
<div class="col-md-6 mb-3"><label class="form-label">Mobile Number <span class="required">*</span></label><input type="tel" class="form-control" id="mobile" pattern="[0-9]{10}" maxlength="10" required></div>
<div class="col-md-6 mb-3"><label class="form-label">Email Address</label><input type="email" class="form-control" id="email"></div>
</div>
<div class="row">
<div class="col-md-6 mb-3"><label class="form-label">Membership Type <span class="required">*</span></label><select class="form-select" id="membershipType" required><option value="">Select</option><option>Student</option><option>General</option><option>Senior Citizen</option><option>Research Scholar</option><option>Faculty</option></select></div>
<div class="col-md-6 mb-3"><label class="form-label">Membership Duration</label><select class="form-select" id="membershipDuration"><option>1 Year</option><option>2 Years</option><option>3 Years</option></select></div>
</div>
<div class="row">
<div class="col-md-6 mb-3"><label class="form-label">ID Proof Type</label><select class="form-select" id="idType"><option value="">Select</option><option>Aadhaar Card</option><option>Voter ID</option><option>PAN Card</option><option>Driving License</option><option>Passport</option><option>Govt. ID</option></select></div>
<div class="col-md-6 mb-3"><label class="form-label">ID Proof Number</label><input type="text" class="form-control" id="idNumber"></div>
</div>
<hr><h5>Photograph Upload</h5>
<div class="mb-3"><label class="form-label">Upload Passport Size Photograph</label><input type="file" class="form-control" id="photo" accept="image/*"><div class="photo-preview" id="previewBox"><span>Preview</span></div><small class="text-muted">Photo is automatically resized and stored as WebP for faster loading.</small></div>
<hr>
<div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="declaration" required><label class="form-check-label" for="declaration">I hereby declare that the information provided above is true and correct.</label></div>
<div class="text-center"><button type="submit" class="btn btn-primary btn-lg">Submit Registration</button><button type="reset" class="btn btn-secondary btn-lg ms-2">Reset</button></div>
</form>
</div></div>

<div class="modal-backdrop-custom" id="optionManagerModal" style="display:none" aria-hidden="true">
<div class="option-manager-modal" role="dialog" aria-modal="true" aria-labelledby="optionManagerTitle">
<div class="d-flex justify-content-between align-items-center mb-3">
<h5 class="mb-0" id="optionManagerTitle">Manage Options</h5>
<button type="button" class="btn-close" id="closeOptionManager" aria-label="Close"></button>
</div>
<div id="optionManagerList"></div>
<div class="border-top pt-3 mt-3">
<label class="form-label fw-semibold" for="newOptionValue">Add New Option</label>
<div class="input-group">
<input type="text" class="form-control" id="newOptionValue" maxlength="100" placeholder="Enter new option">
<button type="button" class="btn btn-primary" id="addOptionBtn">Add</button>
</div>
</div>
<div class="d-flex justify-content-end gap-2 mt-4">
<button type="button" class="btn btn-secondary" id="cancelOptionManager">Cancel</button>
<button type="button" class="btn btn-primary" id="saveOptionManager">Save Changes</button>
</div>
</div>
</div>
<script>
const API_URL=window.MEMBERSHIP_API_URL||"https://library-membership-system.libraryofmiao.workers.dev/api/register";
const photoInput=document.getElementById("photo"),previewBox=document.getElementById("previewBox");
let optimizedPhoto="";
photoInput.addEventListener("change",async function(){const file=this.files[0];optimizedPhoto="";if(!file){previewBox.innerHTML="<span>Preview</span>";return}try{optimizedPhoto=await optimizePhoto(file);previewBox.innerHTML=`<img src="${optimizedPhoto}" alt="Photo">`;}catch(e){console.error(e);alert("Unable to process the photograph.");}});

document.getElementById("registrationForm").addEventListener("submit",async function(e){
e.preventDefault();const submitBtn=document.querySelector('button[type="submit"]');submitBtn.disabled=true;submitBtn.innerText="Saving...";
try{const photoUrl=optimizedPhoto;const fields={fullName:document.getElementById("fullName").value.trim(),guardian:document.getElementById("guardianName").value.trim(),gender:document.getElementById("gender").value,dob:document.getElementById("dob").value,occupation:document.getElementById("occupation").value.trim(),address:document.getElementById("address").value.trim(),district:document.getElementById("district").value.trim(),state:document.getElementById("state").value.trim(),pincode:document.getElementById("pincode").value.trim(),mobile:document.getElementById("mobile").value.trim(),email:document.getElementById("email").value.trim(),membershipType:document.getElementById("membershipType").value,duration:document.getElementById("membershipDuration").value,idType:document.getElementById("idType").value,idNumber:document.getElementById("idNumber").value.trim(),photoUrl};
const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields})});const result=await response.json().catch(()=>({}));if(!response.ok||!result.success)throw new Error(result?.message||"Backend rejected the registration.");alert("Registration Successful!\n\nMembership ID : "+result.memberId+"\nVerify Code : "+result.verify);document.getElementById("registrationForm").reset();optimizedPhoto="";previewBox.innerHTML="<span>Preview</span>";}catch(error){console.error(error);alert("Registration failed.\n\n"+(error.message||"Unable to connect to the membership backend."));}submitBtn.disabled=false;submitBtn.innerText="Submit Registration";
});
const DEFAULT_MEMBERSHIP_TYPES=["Student","General","Senior Citizen","Research Scholar","Faculty"];
const DEFAULT_ID_TYPES=["Aadhaar Card","Voter ID","PAN Card","Driving License","Passport","Govt. ID"];
let MEMBERSHIP_TYPES=[...DEFAULT_MEMBERSHIP_TYPES];
let ID_TYPES=[...DEFAULT_ID_TYPES];
let activeOptionKey="",workingOptions=[];
const optionModal=document.getElementById("optionManagerModal"),optionList=document.getElementById("optionManagerList"),optionTitle=document.getElementById("optionManagerTitle"),newOptionValue=document.getElementById("newOptionValue");
function getManagedOptions(key,defaults){return key==="membershipType"?MEMBERSHIP_TYPES:ID_TYPES;}
function refreshDropdown(selectId,options){const select=document.getElementById(selectId),current=select.value;select.innerHTML="<option value=\"\">Select</option>"+options.map(v=>`<option>${escapeHtml(v)}</option>`).join("");if(options.includes(current))select.value=current;}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));}
function renderOptionManager(){optionList.innerHTML="";workingOptions.forEach((value,index)=>{const row=document.createElement("div");row.className="option-row";row.innerHTML=`<input type="text" class="form-control option-edit" value="${escapeHtml(value)}" maxlength="100" data-index="${index}"><span class="text-muted small">${index+1}</span>`;optionList.appendChild(row);});}
function openOptionManager(key){activeOptionKey=key;workingOptions=getManagedOptions(key,key==="membershipType"?DEFAULT_MEMBERSHIP_TYPES:DEFAULT_ID_TYPES);optionTitle.textContent=key==="membershipType"?"Manage Membership Types":"Manage ID Proof Types";newOptionValue.value="";renderOptionManager();optionModal.style.display="flex";optionModal.setAttribute("aria-hidden","false");setTimeout(()=>newOptionValue.focus(),50);}
function closeOptionManager(){optionModal.style.display="none";optionModal.setAttribute("aria-hidden","true");activeOptionKey="";workingOptions=[];}
document.getElementById("manageMembershipTypeBtn").addEventListener("click",()=>openOptionManager("membershipType"));
document.getElementById("manageIdTypeBtn").addEventListener("click",()=>openOptionManager("idType"));
document.getElementById("closeOptionManager").addEventListener("click",closeOptionManager);
document.getElementById("cancelOptionManager").addEventListener("click",closeOptionManager);
document.getElementById("addOptionBtn").addEventListener("click",()=>{const value=newOptionValue.value.trim();if(!value)return;if(workingOptions.some(v=>v.toLowerCase()===value.toLowerCase())){alert("This option already exists.");return;}workingOptions.push(value);newOptionValue.value="";renderOptionManager();newOptionValue.focus();});
newOptionValue.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();document.getElementById("addOptionBtn").click();}});
document.getElementById("saveOptionManager").addEventListener("click",()=>{const edited=[...optionList.querySelectorAll(".option-edit")].map(i=>i.value.trim());if(edited.some(v=>!v)){alert("Option names cannot be empty.");return;}const unique=new Set(edited.map(v=>v.toLowerCase()));if(unique.size!==edited.length){alert("Option names must be unique.");return;}workingOptions=edited;if(activeOptionKey==="membershipType")MEMBERSHIP_TYPES=[...workingOptions];else ID_TYPES=[...workingOptions];refreshDropdown(activeOptionKey,workingOptions);closeOptionManager();});
optionModal.addEventListener("click",e=>{if(e.target===optionModal)closeOptionManager();});
function loadManagedDropdowns(){refreshDropdown("membershipType",getManagedOptions("membershipType",DEFAULT_MEMBERSHIP_TYPES));refreshDropdown("idType",getManagedOptions("idType",DEFAULT_ID_TYPES));}
loadManagedDropdowns();

function optimizePhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const maxW=600,maxH=750,scale=Math.min(1,maxW/img.naturalWidth,maxH/img.naturalHeight);const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,canvas.width,canvas.height);if(canvas.toDataURL("image/webp").startsWith("data:image/webp")){resolve(canvas.toDataURL("image/webp",0.82));}else{resolve(canvas.toDataURL("image/jpeg",0.82));}};img.onerror=reject;img.src=reader.result;};reader.onerror=reject;reader.readAsDataURL(file);});}
</script>
</body>
</html>
