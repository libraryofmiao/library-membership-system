<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Verification</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f4f6f9}.verify-card{max-width:700px;margin:auto;background:#fff;padding:30px;border-radius:15px;box-shadow:0 0 15px rgba(0,0,0,.1)}.member-photo{width:180px;height:220px;object-fit:cover;border:2px solid #ddd;border-radius:10px}.status-active{color:green;font-weight:bold;font-size:22px}.status-inactive{color:red;font-weight:bold;font-size:22px}.logo{height:90px;margin-bottom:15px}
</style>
</head>
<body>
<div class="container py-5">
<div class="verify-card">
<div class="text-center">
<img class="logo" src="https://drive.google.com/thumbnail?id=1mLDm4Y1bu7UG-WP7h-RzRoDrpQTwY2pe" alt="Library Logo">
<h2>Sub Divisional Library Miao</h2>
<h4 class="mb-4">Member Verification</h4>
</div>
<div id="loading" class="text-center"><div class="spinner-border text-primary"></div><p class="mt-3">Verifying Member...</p></div>
<div id="resultArea" style="display:none;">
<div class="row">
<div class="col-md-4 text-center"><img id="memberPhoto" class="member-photo" src="https://via.placeholder.com/180x220" alt="Member Photo"></div>
<div class="col-md-8">
<h3 id="verifyStatus"></h3><hr>
<p><strong>Name:</strong> <span id="memberName"></span></p>
<p><strong>Member ID:</strong> <span id="memberId"></span></p>
<p><strong>Membership Type:</strong> <span id="memberType"></span></p>
<p><strong>Status:</strong> <span id="memberStatus"></span></p>
</div>
</div>
</div>
<div id="notFound" style="display:none;"><div class="alert alert-danger text-center"><h3>✗ MEMBER NOT FOUND</h3><p>The QR Code is invalid or the member does not exist.</p></div></div>
</div></div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwu7yamVKdb7h9VWGGQ_eUHGpUJesvP4tinAEHAKLhc31tyeEEeOyPdboF0AUwZJLjS/exec";
const params=new URLSearchParams(window.location.search);
const verifyCode=params.get("verify");

if(!verifyCode){showNotFound();}else{verifyMember(verifyCode);}

function showNotFound(){document.getElementById("loading").style.display="none";document.getElementById("resultArea").style.display="none";document.getElementById("notFound").style.display="block";}

function driveImageUrl(url){
 if(!url)return "https://via.placeholder.com/180x220";
 const value=String(url).trim();
 let match=value.match(/[?&]id=([A-Za-z0-9_-]+)/);
 if(match)return "https://drive.google.com/thumbnail?id="+match[1]+"&sz=w600";
 match=value.match(/\/d\/([A-Za-z0-9_-]+)/);
 if(match)return "https://drive.google.com/thumbnail?id="+match[1]+"&sz=w600";
 return value;
}

async function verifyMember(code){
 try{
  const response=await fetch(SCRIPT_URL+"?action=verifyMember&verify="+encodeURIComponent(code)+"&_="+Date.now(),{cache:"no-store"});
  const text=await response.text();
  let result;
  try{result=JSON.parse(text);}catch(e){throw new Error("Invalid response from server.");}
  document.getElementById("loading").style.display="none";
  if(result.status!=="success" || !result.member){showNotFound();return;}
  loadMemberData(result.member);
 }catch(err){console.error("Verification error:",err);showNotFound();}
}

function loadMemberData(member){
 document.getElementById("resultArea").style.display="block";
 document.getElementById("notFound").style.display="none";
 document.getElementById("memberName").innerText=member.fullName||"";
 document.getElementById("memberId").innerText=member.memberId||"";
 document.getElementById("memberType").innerText=member.membershipType||"";
 const status=member.memberStatus||member.status||"";
 document.getElementById("memberStatus").innerText=status;
 if(String(status).trim().toLowerCase()==="active"){
  document.getElementById("verifyStatus").innerHTML='<span class="status-active">✓ VERIFIED MEMBER</span>';
 }else{
  document.getElementById("verifyStatus").innerHTML='<span class="status-inactive">✗ INACTIVE MEMBER</span>';
 }
 const photo=document.getElementById("memberPhoto");
 photo.src=driveImageUrl(member.photoUrl);
 photo.onerror=function(){this.src="https://via.placeholder.com/180x220";};
}
</script>
</body>
</html>
