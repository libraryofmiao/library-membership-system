<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Verification</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f4f6f9;min-height:100vh}.verify-card{max-width:700px;margin:auto;background:#fff;padding:30px;border-radius:15px;box-shadow:0 0 15px rgba(0,0,0,.1)}.member-photo{width:180px;height:220px;object-fit:cover;border:2px solid #ddd;border-radius:10px;background:#f8f9fa}.status-active{color:green;font-weight:bold;font-size:22px}.status-inactive{color:red;font-weight:bold;font-size:22px}.logo{height:90px;margin-bottom:15px;max-width:180px;object-fit:contain}@media(max-width:575px){.verify-card{padding:20px}.member-photo{width:150px;height:185px}}
</style>
</head>
<body>
<div class="container py-5">
<div class="verify-card">
<div class="text-center">
<img class="logo" src="https://drive.google.com/thumbnail?id=1mLDm4Y1bu7UG-WP7h-RzRoDrpQTwY2pe&sz=w300" alt="Library Logo">
<h2>Sub Divisional Library Miao</h2>
<h4 class="mb-4">Member Verification</h4>
</div>
<div id="loading" class="text-center"><div class="spinner-border text-primary"></div><p class="mt-3">Verifying Member...</p></div>
<div id="errorArea" class="alert alert-danger text-center" style="display:none"></div>
<div id="resultArea" style="display:none">
<div class="row align-items-center g-4">
<div class="col-md-4 text-center"><img id="memberPhoto" class="member-photo" src="https://via.placeholder.com/180x220?text=Photo" alt="Member Photo"></div>
<div class="col-md-8">
<h3 id="verifyStatus"></h3><hr>
<p><strong>Name:</strong> <span id="memberName"></span></p>
<p><strong>Member ID:</strong> <span id="memberId"></span></p>
<p><strong>Email:</strong> <span id="memberEmail"></span></p>
<p><strong>Membership Type:</strong> <span id="memberType"></span></p>
<p><strong>Status:</strong> <span id="memberStatus"></span></p>
</div>
</div>
</div>
</div></div>
<script>
const API_BASE=window.MEMBERSHIP_API_BASE||"https://library-membership-system.libraryofmiao.workers.dev/api";
const FALLBACK="https://via.placeholder.com/180x220?text=Photo";
const verifyCode=(new URLSearchParams(window.location.search).get("verify")||"").trim();
if(!verifyCode){showError("No verification code was supplied. Please scan a valid membership QR code.");}else{verifyMember(verifyCode);}

async function verifyMember(code){
 try{
  const response=await fetch(API_BASE+"/verify?verify="+encodeURIComponent(code)+"&_="+Date.now(),{method:"GET",cache:"no-store"});
  const result=await response.json().catch(()=>null);
  if(!response.ok||!result){throw new Error("The membership server returned an invalid response.");}
  document.getElementById("loading").style.display="none";
  if(result.success!==true||!result.member){showError(result.message||"Member not found. The QR code may be invalid.");return;}
  loadMemberData(result.member);
 }catch(err){console.error("Verification error:",err);showError(err.message||"Unable to contact the membership server.");}
}

function showError(message){
 document.getElementById("loading").style.display="none";
 document.getElementById("resultArea").style.display="none";
 const box=document.getElementById("errorArea");
 box.innerText=message;
 box.style.display="block";
}

function loadMemberData(member){
 document.getElementById("resultArea").style.display="block";
 document.getElementById("errorArea").style.display="none";
 document.getElementById("memberName").innerText=member.fullName||"";
 document.getElementById("memberId").innerText=member.memberId||"";
 document.getElementById("memberEmail").innerText=member.email||"";
 document.getElementById("memberType").innerText=member.membershipType||"";
 const status=member.memberStatus||member.status||"";
 document.getElementById("memberStatus").innerText=status;
 document.getElementById("verifyStatus").innerHTML=String(status).trim().toLowerCase()==="active"?'<span class="status-active">✓ VERIFIED MEMBER</span>':'<span class="status-inactive">✗ INACTIVE MEMBER</span>';
 loadPhoto(member.memberId);
}

async function loadPhoto(memberId){
 const photo=document.getElementById("memberPhoto");
 if(!memberId){photo.src=FALLBACK;return;}
 try{
  const response=await fetch(API_BASE+"/photo?memberId="+encodeURIComponent(memberId),{method:"GET",cache:"force-cache"});
  if(!response.ok)throw new Error("Photo unavailable");
  const blob=await response.blob();
  if(!blob.type.startsWith("image/"))throw new Error("Invalid image response");
  const objectUrl=URL.createObjectURL(blob);
  photo.onload=function(){URL.revokeObjectURL(objectUrl);};
  photo.onerror=function(){URL.revokeObjectURL(objectUrl);photo.src=FALLBACK;};
  photo.src=objectUrl;
 }catch(err){console.warn("Member photo load failed:",err);photo.src=FALLBACK;}
}
</script>
</body>
</html>
